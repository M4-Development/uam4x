name: UAM4x

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -vv
          python -m pip install pytest-cov pytest-html

      - name: Run tests and generate reports
        run: |
          pytest "@tests/tests_to_run.txt" `
            --cov=uam4x `
            --cov-report=term-missing `
            --cov-report=html:tests/htmlcov `
            --html=tests/report.html `
            --self-contained-html

      - name: Get commit info
        id: commit_info
        shell: pwsh
        run: |
          $author  = git log -1 --pretty=format:'%an <%ae>'
          $message = git log -1 --pretty=format:'%s'
          $sha     = git rev-parse --short HEAD

          "author=$author"  >> $env:GITHUB_OUTPUT
          "message=$message" >> $env:GITHUB_OUTPUT
          "sha=$sha"        >> $env:GITHUB_OUTPUT

          Write-Host "Commit info extracted:"
          Write-Host "  Author:  $author"
          Write-Host "  Message: $message"
          Write-Host "  SHA:     $sha"

      - name: Debug M4 Jenkins mail secrets
        if: always()
        env:
          M4_JENKINS_EMAIL: ${{ secrets.M4_JENKINS_EMAIL }}
          M4_JENKINS_PASS: ${{ secrets.M4_JENKINS_PASS }}
        run: |
          Write-Host "---- SECRET VALIDATION ----"

          if (-not $env:M4_JENKINS_EMAIL) { Write-Host "M4_JENKINS_EMAIL is EMPTY" }
          else { Write-Host "M4_JENKINS_EMAIL is set" }

          if (-not $env:M4_JENKINS_PASS) { Write-Host "M4_JENKINS_PASS is EMPTY" }
          else { Write-Host "M4_JENKINS_PASS is set" }

          Write-Host "---------------------------"

      - name: List HTML report files
        if: always()
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nContents of tests:"
          if (Test-Path "tests") { Get-ChildItem tests } else { Write-Host "tests directory does not exist" }

          Write-Host "`nContents of tests/htmlcov:"
          if (Test-Path "tests/htmlcov") { Get-ChildItem tests/htmlcov } else { Write-Host "tests/htmlcov directory does not exist" }

      # Validate expected reports exist
      - name: Ensure HTML report files exist
        if: always()
        run: |
          Write-Host "Checking expected HTML report files..."
          $paths = @(
            "tests/report.html",
            "tests/htmlcov/index.html",
            "tests/htmlcov/class_index.html",
            "tests/htmlcov/function_index.html"
          )

          $missing = $false
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Found: $p"
            } else {
              Write-Error "Missing expected report file: $p"
              $missing = $true
            }
          }

          if ($missing) {
            Write-Error "One or more HTML report files are missing. Failing the job."
            exit 1
          } else {
            Write-Host "All expected HTML report files are present."
          }

      - name: Zip coverage HTML folder
        if: always()
        run: |
          if (Test-Path "tests/htmlcov") {
            Write-Host "Zipping tests/htmlcov to tests/htmlcov.zip"
            if (Test-Path "tests/htmlcov.zip") {
              Remove-Item "tests/htmlcov.zip" -Force
            }
            Compress-Archive -Path "tests/htmlcov/*" -DestinationPath "tests/htmlcov.zip"
          } else {
            Write-Error "tests/htmlcov directory does not exist, cannot create zip."
            exit 1
          }

      - name: Send email with reports
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false     # STARTTLS

          username: ${{ secrets.M4_JENKINS_EMAIL }}
          password: ${{ secrets.M4_JENKINS_PASS }}

          from: ${{ secrets.M4_JENKINS_EMAIL }}

          to: |
            nlang@m4-engineering.com, tnascenzi@m4-engineering.com,

          subject: >
            UAM4x CI run on ${{ github.ref_name }} @ ${{ steps.commit_info.outputs.sha }}

          body: |
            UAM4x CI run summary:

            Repo:      ${{ github.repository }}
            Branch:    ${{ github.ref_name }}
            Commit:    ${{ steps.commit_info.outputs.sha }}
            Author:    ${{ steps.commit_info.outputs.author }}
            Message:   ${{ steps.commit_info.outputs.message }}

            # Blame
            Commit Author (Blame): ${{ steps.commit_info.outputs.author }}

            Workflow:  ${{ github.workflow }}
            Run ID:    ${{ github.run_id }}
            Status:    ${{ job.status }}

            The following reports are attached:
              - tests/report.html (pytest HTML report)
              - tests/htmlcov.zip  (zipped coverage HTML directory)

          attachments: |
            tests/report.html
            tests/htmlcov.zip
