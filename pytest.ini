[pytest]
addopts =
    --html=tests/report.html
    --self-contained-html
    --cov=uam4x
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    -rA
    -m "not git"
testpaths = 
    tests

norecursedirs =
    .git
    .github
    dist
    build
    venv*
    System*
    ProgramData
markers =
    git: tests that exercise Git or commit workflows
